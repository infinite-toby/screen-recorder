name: ScreenRecorder
options:
  deploymentTarget:
    macOS: "15.0"
packages:
  RecorderCore:
    path: .
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      # Notarization rejects the debugger entitlement Xcode otherwise injects.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  ScreenRecorder:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        optional: true
    dependencies:
      - package: RecorderCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Screen Recorder
        CFBundleName: Screen Recorder
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.video
        NSCameraUsageDescription: Screen Recorder records your camera alongside your screen.
        NSMicrophoneUsageDescription: Screen Recorder records your voice alongside your screen.
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: App/ScreenRecorder.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ScreenRecorder
        PRODUCT_NAME: Screen Recorder
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
